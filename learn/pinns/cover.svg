<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" role="img" aria-labelledby="title desc"><title id="title">From a heated rod to a physics-informed network</title><desc id="desc">A warm rod, a coordinate network, and a loss enforcing the heat equation.</desc><defs><linearGradient id="heat"><stop stop-color="#3e8dbd"/><stop offset=".5" stop-color="#ffc45d"/><stop offset="1" stop-color="#3e8dbd"/></linearGradient></defs><g fill="#e7eef1" font-family="Georgia,serif" text-anchor="middle"><text x="260" y="40" font-size="23">Physics → network → solution</text><rect x="62" y="65" width="396" height="34" rx="6" fill="url(#heat)"/><text x="260" y="125" font-size="18">Temperature along a rod</text><g stroke="#7ccfdf" stroke-width="1.6" opacity=".8"><path d="M102 192L220 170M102 192L220 210M102 192L220 250M102 236L220 170M102 236L220 210M102 236L220 250M220 170L350 210M220 210L350 210M220 250L350 210"/></g><g stroke="#7ccfdf" stroke-width="2" fill="#122732"><circle cx="102" cy="192" r="17"/><circle cx="102" cy="236" r="17"/><circle cx="220" cy="170" r="16"/><circle cx="220" cy="210" r="16"/><circle cx="220" cy="250" r="16"/><circle cx="350" cy="210" r="21"/></g><text x="102" y="198" font-size="18">x</text><text x="102" y="242" font-size="18">t</text><text x="419" y="217" font-size="23">u(x,t)</text><text x="260" y="310" font-size="23" fill="#ffc45d">uₜ − αuₓₓ = 0</text></g></svg>