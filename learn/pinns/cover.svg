<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" role="img" aria-labelledby="title desc"><title id="title">From a Burgers field to a physics-informed network</title><desc id="desc">A velocity-like profile, a coordinate network, and a differential-equation test.</desc><defs><linearGradient id="heat"><stop stop-color="#3e8dbd"/><stop offset=".5" stop-color="#ffc45d"/><stop offset="1" stop-color="#3e8dbd"/></linearGradient></defs><g fill="#e7eef1" font-family="Georgia,serif" text-anchor="middle"><text x="260" y="40" font-size="23">Physics → network → solution</text><path d="M62 83H458" stroke="#566b75"/><path d="M62 83C125 4 180 4 260 83S395 162 458 83" fill="none" stroke="#79d4ef" stroke-width="3"/><path d="M62 83C165 5 229 5 260 83S355 161 458 83" fill="none" stroke="#ffc45d" stroke-width="3"/><text x="260" y="125" font-size="18">Burgers velocity-like field</text><g stroke="#7ccfdf" stroke-width="1.6" opacity=".8"><path d="M102 192L220 170M102 192L220 210M102 192L220 250M102 236L220 170M102 236L220 210M102 236L220 250M220 170L350 210M220 210L350 210M220 250L350 210"/></g><g stroke="#7ccfdf" stroke-width="2" fill="#122732"><circle cx="102" cy="192" r="17"/><circle cx="102" cy="236" r="17"/><circle cx="220" cy="170" r="16"/><circle cx="220" cy="210" r="16"/><circle cx="220" cy="250" r="16"/><circle cx="350" cy="210" r="21"/></g><text x="102" y="198" font-size="18">x</text><text x="102" y="242" font-size="18">t</text><text x="419" y="217" font-size="23">Field</text><text x="260" y="310" font-size="23" fill="#ffc45d">Test the governing equation</text></g></svg>